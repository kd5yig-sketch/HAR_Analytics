name: Release
# Push a tag like v1.0.0 or v1.0.0-beta.1 to publish a release. Tags with a "-" suffix
# become pre-releases. The tag must match the version in package.json, and the release
# notes are the CHANGELOG.md section headed "## <tag>".
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Package
        run: |
          npm pack
          cp har-analyzer.html "har-analyzer-${GITHUB_REF_NAME}.html"
          sha256sum har-analyzer-*.html har-analytics-*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "HAR Analytics ${GITHUB_REF_NAME#v}" --notes-file notes.md $pre \
            har-analyzer-*.html har-analytics-*.tgz SHA256SUMS.txt
